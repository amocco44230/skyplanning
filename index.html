<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYPLANNING - Coming Soon</title>
    
    <!-- Scripts Firebase version web compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>

    <style>
        :root {
            --af-blue: #002157;
            --af-red: #ED2939;
            --af-white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--af-blue);
            color: var(--af-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 2rem 1rem;
            background-image: radial-gradient(circle at top right, #003380 0%, var(--af-blue) 70%);
        }

        header { 
            margin-top: 1rem; 
        }

        .logo-container {
            background-color: var(--af-white);
            padding: 1rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: inline-block;
        }

        .logo-hop {
            font-size: 3rem;
            font-weight: 900;
            color: var(--af-red);
            line-height: 1;
            font-family: Arial Black, sans-serif;
        }

        main {
            max-width: 600px;
            margin: 2rem 0;
        }

        .badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--af-white);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #A0B2D6;
            font-weight: 300;
            margin-bottom: 2rem;
        }

        /* Bouton de test notification */
        .btn-notif {
            background-color: var(--af-red);
            color: var(--af-white);
            border: none;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(237, 41, 57, 0.4);
            margin-top: 1rem;
        }

        .btn-notif:hover {
            background-color: #c81e2b;
        }

        .btn-notif:active {
            transform: scale(0.98);
        }

        #status-msg {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #A0B2D6;
            word-break: break-all;
            padding: 0 1rem;
        }

        footer {
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        footer strong {
            color: var(--af-white);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-hop">HOP!</div>
        </div>
    </header>

    <main>
        <div class="badge">Coming Soon</div>
        <h1>SKYPLANNING</h1>
        <p class="subtitle">Votre nouvelle plateforme de planification</p>
        
        <button class="btn-notif" onclick="demanderNotification()">Activer les notifications</button>
        <p id="status-msg"></p>
    </main>

    <footer>
        <p>powered by <strong>amocco</strong></p>
    </footer>

    <script>
        // Remplace avec tes vraies clés Firebase
        const firebaseConfig = {
              apiKey: "AIzaSyDyxBub9vexjpmAwlyuNgKd44t2fYqGeTw",
  authDomain: "skyplanning-26392.firebaseapp.com",
  projectId: "skyplanning-26392",
  storageBucket: "skyplanning-26392.firebasestorage.app",
  messagingSenderId: "507713371403",
  appId: "1:507713371403:web:d321e1e5aea4b94570f60e"
};


        // Initialisation de Firebase
        firebase.initializeApp(firebaseConfig);
        const messaging = firebase.messaging();

        // Enregistrement préventif du Service Worker dès le chargement de la page
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/firebase-messaging-sw.js')
                .then((registration) => {
                    console.log('Service Worker enregistré avec succès :', registration);
                })
                .catch((err) => {
                    console.error('Erreur lors de l\'enregistrement du Service Worker :', err);
                });
        }

        function demanderNotification() {
            const statusMsg = document.getElementById('status-msg');
            
            if (!('Notification' in window)) {
                statusMsg.innerText = "Ce navigateur ne prend pas en charge les notifications push.";
                return;
            }

            statusMsg.innerText = "Demande d'autorisation en cours...";

            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    statusMsg.innerText = "Autorisation accordée ! En attente du Service Worker...";

                    // On attend impérativement que le Service Worker soit totalement prêt
                    navigator.serviceWorker.ready.then((serviceWorkerRegistration) => {
                        statusMsg.innerText = "Récupération du jeton Firebase...";
                        
                        messaging.getToken({ 
                            vapidKey: "BAFLMJt5c1KfwS8tmNmqK2b1eRz1WJar5xqI4ZDp42we2J-NFKzMn7r_UZfgP4tExNXZ87g4Lr-PmD1JXkNdn6A",
                            serviceWorkerRegistration: serviceWorkerRegistration 
                        }).then((currentToken) => {
                            if (currentToken) {
                                console.log("Token FCM :", currentToken);
                                statusMsg.innerText = "Notifications activées avec succès !";
                                
                                // Déclenche une notification locale de test
                                new Notification("SKYPLANNING", {
                                    body: "Les notifications push sont fonctionnelles !",
                                    icon: "https://skyplanninghop.netlify.app/logo.png"
                                });
                            } else {
                                statusMsg.innerText = "Impossible d'obtenir le jeton d'autorisation FCM.";
                            }
                        }).catch((err) => {
                            statusMsg.innerText = "Erreur jeton : " + err;
                        });
                    }).catch((err) => {
                        statusMsg.innerText = "Service Worker non prêt : " + err;
                    });
                } else if (permission === 'denied') {
                    statusMsg.innerText = "Autorisation refusée par l'utilisateur.";
                } else {
                    statusMsg.innerText = "Demande d'autorisation fermée.";
                }
            });
        }
    </script>

</body>
</html>
